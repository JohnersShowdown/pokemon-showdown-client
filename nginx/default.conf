server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index testclient.html;

    # Reasonable defaults
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    client_max_body_size 4m;

    # gzip — most of the build is JS/JSON/CSS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Map / to testclient.html, leave deep links as-is so things like
    # /sprites/... and /data/... still resolve.
    location = / {
        try_files /testclient.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP shims (crossdomain.php, customcss.php, ladder.php, etc.) require a
    # backend we don't run here. Return 404 instead of leaking source.
    location ~ \.php$ {
        return 404;
    }

    # Long cache for fingerprinted/static assets
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp|mp3|ogg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Built data is small & changes per build — short cache, must-revalidate
    location ^~ /data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Never cache HTML — entrypoints change asset hashes
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Block dotfiles (.git, .env, .htaccess, ...)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
